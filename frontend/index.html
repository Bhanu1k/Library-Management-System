<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Library Management System</title>
  <meta name="description" content="Sign in to the Library Management System to manage books, members, and loans." />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background: var(--gray-950);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .login-page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    /* Animated background */
    .bg-shapes {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .bg-shapes .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 20s ease-in-out infinite;
    }

    .shape-1 {
      width: 400px; height: 400px;
      background: var(--primary-600);
      top: -100px; left: -100px;
      animation-delay: 0s;
    }

    .shape-2 {
      width: 350px; height: 350px;
      background: #7c3aed;
      bottom: -80px; right: -80px;
      animation-delay: -5s;
    }

    .shape-3 {
      width: 250px; height: 250px;
      background: #2563eb;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(20px, 10px) scale(1.02); }
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--border-radius-xl);
      padding: 48px 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-brand .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary-500), #7c3aed);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .login-brand h1 {
      color: var(--text-white);
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .login-brand p {
      color: var(--gray-400);
      font-size: 0.875rem;
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form .form-label {
      color: var(--gray-300);
      font-size: 0.8125rem;
      font-weight: 500;
    }

    .login-form .form-input {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-white);
      padding: 12px 16px;
      border-radius: var(--border-radius);
      font-size: 0.9375rem;
    }

    .login-form .form-input::placeholder {
      color: var(--gray-500);
    }

    .login-form .form-input:focus {
      border-color: var(--primary-400);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      background: rgba(255, 255, 255, 0.1);
    }

    .password-field {
      position: relative;
    }

    .password-field .form-input {
      padding-right: 44px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.125rem;
      color: var(--gray-400);
      padding: 4px;
    }

    .password-toggle:hover {
      color: var(--gray-300);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-500), #7c3aed);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition-base);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    .login-btn:hover {
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }

    .login-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: var(--border-radius-sm);
      font-size: 0.8125rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-footer {
      text-align: center;
      margin-top: 28px;
      color: var(--gray-500);
      font-size: 0.8125rem;
    }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }

    .shake {
      animation: shake 0.5s ease;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <!-- Login Card -->
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">📖</div>
        <h1>Library Management</h1>
        <p>Sign in to your account</p>
      </div>

      <!-- Error Message -->
      <div id="loginError" class="login-error hidden">
        <span>✕</span>
        <span id="loginErrorMsg">Invalid credentials</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter your username" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required />
            <button type="button" id="togglePassword" class="password-toggle">👁</button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="login-btn">
          Sign In
        </button>
      </form>

      <div class="login-footer">
        <p>Library Management System v1.0</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initLoginPage();
  </script>
</body>
</html>
