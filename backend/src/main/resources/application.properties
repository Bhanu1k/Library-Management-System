# ==========================================
# Library Management System - Configuration
# ==========================================

# Server
server.port=${PORT:8099}


# ==========================================
# Database (PostgreSQL)
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/librarydb}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==========================================
# JWT
# ==========================================
app.jwt.secret=${JWT_SECRET:LibraryManagementSystemSecretKeyForJWTTokenGeneration2026SecureKey}
app.jwt.expiration=86400000

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:3000,http://127.0.0.1:3000,https://librarymanagementsystemai.netlify.app
# ==========================================
# Logging
# ==========================================
logging.level.com.library=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ==========================================
# Email (leave blank to disable)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# SMS - Twilio (leave blank to disable)
# ==========================================
twilio.account.sid=
twilio.auth.token=
twilio.phone.number=

# ==========================================
# Notification Settings
# ==========================================
notification.due-date-reminder.enabled=true
notification.fine-alert.enabled=true
notification.new-book-arrival.enabled=true
notification.scheduler.enabled=true
notification.scheduler.due-date-reminder-cron=0 0 8 * * ?
notification.scheduler.fine-alert-cron=0 0 9 * * ?
notification.max-retry-attempts=3
notification.retry-delay-ms=5000

# ==========================================
# File Upload
# ==========================================
app.upload.dir=uploads/avatars
app.upload.max-size=2097152
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# Scheduling
# ==========================================
spring.task.scheduling.pool.size=5
