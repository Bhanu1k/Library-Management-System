# ==========================================
# Library Management System - Configuration
# ==========================================

# Server
server.port=${PORT:8099}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/librarydb}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# SQL init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=${JWT_SECRET:LibraryManagementSystemSecretKeyForJWTTokenGeneration2026SecureKey}
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Logging
logging.level.com.library=DEBUG
logging.level.org.springframework.security=INFO

# ==========================================
# Email Configuration (SMTP)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# SMS Configuration (Twilio)
# ==========================================
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# ==========================================
# Notification Settings
# ==========================================
notification.due-date-reminder.enabled=true
notification.fine-alert.enabled=true
notification.new-book-arrival.enabled=true
notification.scheduler.enabled=true
notification.scheduler.due-date-reminder-cron=0 0 8 * * ?
notification.scheduler.fine-alert-cron=0 0 9 * * ?
notification.max-retry-attempts=3
notification.retry-delay-ms=5000

# Profile picture upload settings
app.upload.dir=uploads/avatars
app.upload.max-size=2097152

# Allow multipart file uploads (Spring Boot default is 1MB — increase it)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
